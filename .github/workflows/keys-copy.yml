# Every hour: STK's public keys, read from production (GET /v1/rules?keys=1, no key, no secret), added to keys.json.
# Append-only: a key once in it stays; only a key made invalid gets its note. A push publishes it with the site, and
# asks Software Heritage and the Internet Archive for a copy.
name: keys-copy
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: keys-copy
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: the repository, by git alone (no action whose runtime GitHub retires)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD
      - name: Copy the public keys
        run: |
          r=$(python3 scripts/keys_copy.py)
          echo "result: $r"
          if [ "$r" = changed ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keys.json && git commit -qm "keys.json: public keys copied (append-only)" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
            # third-party copies (CEO 2026-11-21): Software Heritage keeps this repository with its history; the
            # Internet Archive keeps keys.json as served. Free, no account; a failure here changes nothing above.
            curl -s -m 60 -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${GITHUB_REPOSITORY}/" || true
            curl -s -m 150 -o /dev/null -w "Internet Archive: %{http_code}\n" "https://web.archive.org/save/https://stk-evidence.com/keys.json" || true
          fi
