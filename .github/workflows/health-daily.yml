# Once a day, from GitHub's servers (no Mac, no key, no secret): GET https://api.stk-evidence.com/v1/health must answer
# 200 {"ok": true}, and https://stk-evidence.com/ must answer 200. Three tries, a minute apart, before it counts as
# down. Down: this run fails, and GitHub emails the repository's owner (CEO 2026-11-26).
name: health-daily
on:
  schedule:
    - cron: "7 0 * * *"            # 00:07 UTC, 09:07 in Tokyo
  workflow_dispatch:
    inputs:
      url:
        description: "the health URL to read (a wrong one shows the failure email)"
        default: "https://api.stk-evidence.com/v1/health"
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: STK answers
        env:
          URL: ${{ inputs.url || 'https://api.stk-evidence.com/v1/health' }}
        run: |
          for i in 1 2 3; do
            body=$(curl -s -m 20 -w '\n%{http_code}' "$URL") || body=$(printf '\n000')
            code=$(printf '%s' "$body" | tail -n1); json=$(printf '%s' "$body" | sed '$d')
            site=$(curl -s -m 20 -o /dev/null -w '%{http_code}' https://stk-evidence.com/ || echo 000)
            echo "try $i at $(date -u +%FT%TZ): api $code $json; site $site"
            if [ "$code" = 200 ] && printf '%s' "$json" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("ok") is True else 1)' && [ "$site" = 200 ]; then
              echo "STK is up"; exit 0
            fi
            [ $i = 3 ] || sleep 60
          done
          echo "::error::STK is down: api $code $json; site $site"
          exit 1
