# One time (CEO 2026-11-25): the round trip to STK's API from GitHub's US runners, before the server moves to the US.
# Public addresses only, no key, no secret. Deleted after it runs.
name: rtt-once
on: workflow_dispatch
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: where this runner is
        run: curl -s -H Metadata:true --max-time 3 "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || echo unknown
      - name: GET /v1/health, 200 times, one connection
        run: |
          python3 - <<'PY'
          import http.client, time, ssl
          for host in ("api.stk-evidence.com", "stk-api-glj8.onrender.com"):
              c = http.client.HTTPSConnection(host, timeout=10, context=ssl.create_default_context())
              c.request("GET", "/v1/health"); c.getresponse().read()
              t = []
              for _ in range(200):
                  s = time.perf_counter(); c.request("GET", "/v1/health"); r = c.getresponse(); r.read(); t.append((time.perf_counter() - s) * 1000)
              t.sort(); q = lambda p: round(t[int(p * len(t)) - 1], 1)
              print(host, "status", r.status, "p50", q(0.5), "p90", q(0.9), "p99", q(0.99), "max", round(t[-1], 1), "ms")
          PY
